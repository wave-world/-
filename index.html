<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NISA & iDeCo 完全版シミュレータ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 15px; background: #f0f2f5; color: #333; margin: 0; }
        .container { max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 15px; font-size: 18px; }
        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-group { flex: 1; margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 12px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .hint { font-size: 10px; color: #777; margin-top: 2px; }
        button { width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .result-box { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; border-left: 5px solid #1a73e8; font-size: 14px; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .summary-total { border-top: 2px solid #ddd; padding-top: 8px; font-size: 16px; color: #1a73e8; font-weight: bold; }
        .chart-container { position: relative; height: 35vh; width: 100%; margin-top: 10px;}
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>現在の状況</h2>
        <div class="input-row">
            <div class="input-group"><label>現在の年齢</label><input type="number" id="currentAge" value="30"></div>
            <div class="input-group"><label>終了年齢</label><input type="number" id="endAge" value="65"></div>
        </div>
        <div class="input-row">
            <div class="input-group">
                <label>NISA現在の評価額(円)</label><input type="number" id="startNisaValue" value="1000000">
            </div>
            <div class="input-group">
                <label>NISA使用済枠(元本)</label><input type="number" id="usedNisaLimit" value="800000">
                <div class="hint">※生涯1800万のうち消費済の額</div>
            </div>
        </div>
        <div class="input-group">
            <label>iDeCo現在の評価額(円)</label><input type="number" id="startIdecoValue" value="500000">
        </div>

        <hr style="border:0; border-top:1px solid #eee;">
        <h2>これからの積立設定</h2>
        <div class="input-row">
            <div class="input-group"><label>NISA月額</label><input type="number" id="nisaMonthly" value="50000"></div>
            <div class="input-group"><label>iDeCo月額</label><input type="number" id="idecoMonthly" value="23000"></div>
        </div>
        <div class="input-group"><label>期待利率 (年利%)</label><input type="number" id="rate" value="5" step="0.1"></div>
        
        <button onclick="simulate()">シミュレーション実行</button>
    </div>

    <div class="card" id="chartCard" style="display:none;">
        <div class="chart-container"><canvas id="myChart"></canvas></div>
        <div id="result" class="result-box"></div>
    </div>
</div>

<script>
let myChart = null;
function simulate() {
    // 入力値取得
    const curAge = parseInt(document.getElementById('currentAge').value) || 0;
    const endAge = parseInt(document.getElementById('endAge').value) || 0;
    const years = endAge - curAge;
    
    let startNisa = parseFloat(document.getElementById('startNisaValue').value) || 0;
    let usedNisa = parseFloat(document.getElementById('usedNisaLimit').value) || 0;
    let startIdeco = parseFloat(document.getElementById('startIdecoValue').value) || 0;
    
    let nMonthly = parseFloat(document.getElementById('nisaMonthly').value) || 0;
    const iMonthly = parseFloat(document.getElementById('idecoMonthly').value) || 0;
    const annualRate = parseFloat(document.getElementById('rate').value) || 0;

    if (years <= 0) { alert("終了年齢は現在の年齢より高く設定してください。"); return; }
    if (nMonthly > 100000) nMonthly = 100000;

    const r = annualRate / 100 / 12;
    const totalMonths = years * 12;
    const NISA_LIMIT = 18000000;

    let labels = [];
    let nisaData = [];
    let idecoData = [];
    
    let nisaTotal = startNisa;
    let nisaPrincipal = usedNisa; // 使用済み枠からスタート
    let idecoTotal = startIdeco;
    let idecoPrincipalTotal = 0; // これからの追加分

    // 0年目（現在）
    labels.push(`${curAge}歳`);
    nisaData.push(Math.round(nisaTotal));
    idecoData.push(Math.round(idecoTotal));

    for (let y = 1; y <= years; y++) {
        for (let m = 1; m <= 12; m++) {
            // NISA積立
            if (nisaPrincipal + nMonthly <= NISA_LIMIT) {
                nisaTotal += nMonthly;
                nisaPrincipal += nMonthly;
            } else if (nisaPrincipal < NISA_LIMIT) {
                const rem = NISA_LIMIT - nisaPrincipal;
                nisaTotal += rem;
                nisaPrincipal += rem;
            }
            nisaTotal *= (1 + r);

            // iDeCo積立
            idecoTotal += iMonthly;
            idecoTotal *= (1 + r);
            idecoPrincipalTotal += iMonthly;
        }
        labels.push(`${curAge + y}歳`);
        nisaData.push(Math.round(nisaTotal));
        idecoData.push(Math.round(idecoTotal));
    }

    document.getElementById('chartCard').style.display = 'block';
    const finalTotal = nisaTotal + idecoTotal;
    const totalInputAfterNow = (nisaPrincipal - usedNisa) + idecoPrincipalTotal;

    document.getElementById('result').innerHTML = `
        <strong>【${endAge}歳時点の結果】</strong><br>
        <div class="summary-item"><span>NISA資産</span><span>¥${Math.round(nisaTotal).toLocaleString()}</span></div>
        <div class="summary-item"><span>iDeCo資産</span><span>¥${Math.round(idecoTotal).toLocaleString()}</span></div>
        <hr>
        <div class="summary-item"><span>これから投資する総額</span><span>¥${Math.round(totalInputAfterNow).toLocaleString()}</span></div>
        <div class="summary-total"><div class="summary-item"><span>最終総資産額</span><span>¥${Math.round(finalTotal).toLocaleString()}</span></div></div>
        <div class="hint" style="margin-top:10px; color:#d93025;">※NISA生涯枠残り: ¥${(NISA_LIMIT - nisaPrincipal).toLocaleString()}</div>
    `;

    const ctx = document.getElementById('myChart').getContext('2d');
    if (myChart) myChart.destroy();
    myChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [
                { label: 'NISA', data: nisaData, borderColor: '#1a73e8', backgroundColor: 'rgba(26,115,232,0.1)', fill: true, tension: 0.3 },
                { label: 'iDeCo', data: idecoData, borderColor: '#34a853', backgroundColor: 'rgba(52,168,83,0.1)', fill: true, tension: 0.3 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            scales: { y: { beginAtZero: false, ticks: { callback: v => (v / 10000) + '万' } } }
        }
    });
}
</script>
</body>
</html>
