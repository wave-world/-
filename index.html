<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NISA & iDeCo パーソナルシミュレータ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 15px; background: #f0f2f5; color: #333; margin: 0; }
        .container { max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 15px; font-size: 18px; }
        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-group { flex: 1; margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 12px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .result-box { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px; border-left: 5px solid #1a73e8; font-size: 14px; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .summary-total { border-top: 2px solid #ddd; padding-top: 8px; font-size: 16px; color: #1a73e8; font-weight: bold; }
        .chart-container { position: relative; height: 45vh; width: 100%; margin-top: 10px;}
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>現在の状況</h2>
        <div class="input-row">
            <div class="input-group"><label>現在の年齢</label><input type="number" id="currentAge" value="30"></div>
            <div class="input-group"><label>終了年齢</label><input type="number" id="endAge" value="65"></div>
        </div>
        <div class="input-row">
            <div class="input-group"><label>NISA評価額</label><input type="number" id="startNisaValue" value="1000000"></div>
            <div class="input-group"><label>NISA使用済枠</label><input type="number" id="usedNisaLimit" value="800000"></div>
        </div>
        <div class="input-group"><label>iDeCo評価額</label><input type="number" id="startIdecoValue" value="500000"></div>

        <hr style="border:0; border-top:1px solid #eee;">
        <h2>積立設定</h2>
        <div class="input-row">
            <div class="input-group"><label>NISA月額</label><input type="number" id="nisaMonthly" value="50000"></div>
            <div class="input-group"><label>iDeCo月額</label><input type="number" id="idecoMonthly" value="23000"></div>
        </div>
        <div class="input-group"><label>期待利率 (%)</label><input type="number" id="rate" value="5" step="0.1"></div>
        <button onclick="simulate()">計算 & データを保存</button>
    </div>

    <div class="card" id="chartCard" style="display:none;">
        <div class="chart-container"><canvas id="myChart"></canvas></div>
        <div id="result" class="result-box"></div>
    </div>
</div>

<script>
let myChart = null;

// --- 起動時に保存データを読み込む ---
window.onload = function() {
    const savedData = localStorage.getItem('invSimData');
    if (savedData) {
        const data = JSON.parse(savedData);
        document.getElementById('currentAge').value = data.currentAge;
        document.getElementById('endAge').value = data.endAge;
        document.getElementById('startNisaValue').value = data.startNisaValue;
        document.getElementById('usedNisaLimit').value = data.usedNisaLimit;
        document.getElementById('startIdecoValue').value = data.startIdecoValue;
        document.getElementById('nisaMonthly').value = data.nisaMonthly;
        document.getElementById('idecoMonthly').value = data.idecoMonthly;
        document.getElementById('rate').value = data.rate;
        simulate(); // 保存データがあれば即座に計算実行
    }
};

function simulate() {
    const inputs = {
        currentAge: parseInt(document.getElementById('currentAge').value) || 0,
        endAge: parseInt(document.getElementById('endAge').value) || 0,
        startNisaValue: parseFloat(document.getElementById('startNisaValue').value) || 0,
        usedNisaLimit: parseFloat(document.getElementById('usedNisaLimit').value) || 0,
        startIdecoValue: parseFloat(document.getElementById('startIdecoValue').value) || 0,
        nisaMonthly: parseFloat(document.getElementById('nisaMonthly').value) || 0,
        idecoMonthly: parseFloat(document.getElementById('idecoMonthly').value) || 0,
        rate: parseFloat(document.getElementById('rate').value) || 0
    };

    // --- データをLocalStorageに保存 ---
    localStorage.setItem('invSimData', JSON.stringify(inputs));

    const years = inputs.endAge - inputs.currentAge;
    if (years <= 0) return;
    
    const r = inputs.rate / 100 / 12;
    const NISA_LIMIT = 18000000;

    let labels = [];
    let assetData = [];
    let principalData = [];
    
    let nisaTotal = inputs.startNisaValue;
    let nisaPrincipal = inputs.usedNisaLimit;
    let idecoTotal = inputs.startIdecoValue;
    let idecoPrincipal = inputs.startIdecoValue;

    labels.push(`${inputs.currentAge}歳`);
    assetData.push(Math.round(nisaTotal + idecoTotal));
    principalData.push(Math.round(nisaPrincipal + idecoPrincipal));

    for (let y = 1; y <= years; y++) {
        for (let m = 1; m <= 12; m++) {
            if (nisaPrincipal + inputs.nisaMonthly <= NISA_LIMIT) {
                nisaTotal += inputs.nisaMonthly; nisaPrincipal += inputs.nisaMonthly;
            } else if (nisaPrincipal < NISA_LIMIT) {
                const rem = NISA_LIMIT - nisaPrincipal;
                nisaTotal += rem; nisaPrincipal += rem;
            }
            nisaTotal *= (1 + r);
            idecoTotal += inputs.idecoMonthly; idecoPrincipal += inputs.idecoMonthly;
            idecoTotal *= (1 + r);
        }
        labels.push(`${inputs.currentAge + y}歳`);
        assetData.push(Math.round(nisaTotal + idecoTotal));
        principalData.push(Math.round(nisaPrincipal + idecoPrincipal));
    }

    document.getElementById('chartCard').style.display = 'block';
    const finalAsset = nisaTotal + idecoTotal;
    const finalPrincipal = nisaPrincipal + idecoPrincipal;

    document.getElementById('result').innerHTML = `
        <div class="summary-item"><span>最終資産額(評価額)</span><span>¥${Math.round(finalAsset).toLocaleString()}</span></div>
        <div class="summary-item"><span>累計積立額(元本)</span><span>¥${Math.round(finalPrincipal).toLocaleString()}</span></div>
        <div class="summary-total"><div class="summary-item"><span>運用益</span><span>+¥${Math.round(finalAsset - finalPrincipal).toLocaleString()}</span></div></div>
    `;

    const ctx = document.getElementById('myChart').getContext('2d');
    if (myChart) myChart.destroy();
    myChart = new Chart(ctx, {
        data: {
            labels: labels,
            datasets: [
                { type: 'line', label: '評価金額', data: assetData, borderColor: '#1a73e8', backgroundColor: 'rgba(26,115,232,0.1)', fill: false, tension: 0.3 },
                { type: 'bar', label: '掛金(元本)', data: principalData, backgroundColor: 'rgba(95, 99, 104, 0.4)', borderColor: '#5f6368', borderWidth: 1 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            scales: { y: { beginAtZero: true, ticks: { callback: v => (v / 10000) + '万' } } }
        }
    });
}
</script>
</body>
</html>
