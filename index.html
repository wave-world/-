<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NISA & iDeCo シミュレータ</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        .result-box { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h2>投資シミュレータ</h2>
    <label>NISA月額 (円)</label>
    <input type="number" id="nisaAmount" value="50000">
    
    <label>iDeCo月額 (円)</label>
    <input type="number" id="idecoAmount" value="23000">
    
    <label>期待利率 (年利%)</label>
    <input type="number" id="rate" value="5">
    
    <label>積立期間 (年)</label>
    <input type="number" id="years" value="20">
    
    <button onclick="simulate()">計算する</button>

    <div id="result" class="result-box" style="display:none;"></div>
</div>

<script>
function simulate() {
    const nAmount = parseFloat(document.getElementById('nisaAmount').value) || 0;
    const iAmount = parseFloat(document.getElementById('idecoAmount').value) || 0;
    const annualRate = parseFloat(document.getElementById('rate').value) || 0;
    const years = parseInt(document.getElementById('years').value) || 0;

    const r = annualRate / 100 / 12;
    const n = years * 12;

    const calcFV = (pmt, rate, months) => {
        if (rate === 0) return pmt * months;
        return pmt * ((Math.pow(1 + rate, months) - 1) / rate) * (1 + rate);
    };

    const nisaTotal = calcFV(nAmount, r, n);
    const idecoTotal = calcFV(iAmount, r, n);
    const combined = nisaTotal + idecoTotal;

    const resDiv = document.getElementById('result');
    resDiv.style.display = 'block';
    resDiv.innerHTML = `
        <strong>【シミュレーション結果】</strong><br>
        NISA合計: ¥${Math.round(nisaTotal).toLocaleString()}<br>
        iDeCo合計: ¥${Math.round(idecoTotal).toLocaleString()}<br>
        <hr>
        <strong>総合計: ¥${Math.round(combined).toLocaleString()}</strong>
    `;
}
</script>
</body>
</html>
