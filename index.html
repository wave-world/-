<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NISA & iDeCo シミュレータ</title>
    
    <link rel="icon" href="icon.png?v=1">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="資産の地図">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary-color: #1a73e8; --bg-color: #f0f2f5; }
        body { font-family: -apple-system, sans-serif; padding: 15px; background: var(--bg-color); color: #333; margin: 0; }
        .container { max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2 { text-align: center; color: var(--primary-color); margin-bottom: 15px; font-size: 18px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-group { flex: 1; margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 11px; color: #555; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; transition: border 0.3s; appearance: none; }
        input:focus { border-color: var(--primary-color); outline: none; }
        .hint { font-size: 10px; color: #888; margin-top: 2px; }
        button { width: 100%; padding: 16px; background: var(--primary-color); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        button:active { transform: scale(0.98); background: #1557b0; }
        .result-box { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 10px; border-left: 5px solid var(--primary-color); }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .summary-total { border-top: 2px solid #ddd; padding-top: 10px; font-size: 18px; color: var(--primary-color); font-weight: bold; }
        .status { font-size: 11px; color: #d93025; font-weight: bold; margin-bottom: 10px; }
        .chart-container { position: relative; height: 45vh; width: 100%; margin-top: 10px;}
        hr { border: 0; border-top: 1px solid #eee; margin: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>現在の状況</h2>
        <div class="input-row">
            <div class="input-group"><label>現在の年齢</label><input type="number" id="currentAge" value="30"></div>
            <div class="input-group"><label>終了年齢</label><input type="number" id="endAge" value="65"></div>
        </div>
        
        <div class="input-row">
            <div class="input-group">
                <label>NISA現在の評価額</label><input type="number" id="startNisaValue" value="1000000">
            </div>
            <div class="input-group">
                <label>NISA評価損益</label><input type="number" id="nisaProfit" value="200000">
            </div>
        </div>

        <div class="input-row">
            <div class="input-group">
                <label>iDeCo現在の評価額</label><input type="number" id="startIdecoValue" value="500000">
            </div>
            <div class="input-group">
                <label>iDeCo評価損益</label><input type="number" id="idecoProfit" value="50000">
            </div>
        </div>

        <hr>
        <h2>これからの積立設定</h2>
        <div class="input-row">
            <div class="input-group"><label>NISA月額</label><input type="number" id="nisaMonthly" value="50000"></div>
            <div class="input-group"><label>iDeCo月額</label><input type="number" id="idecoMonthly" value="23000"></div>
        </div>
        <div class="input-group"><label>期待利率 (年利%)</label><input type="number" id="rate" value="5" step="0.1"></div>
        <button onclick="simulate()">計算 ＆ データを保存</button>
    </div>

    <div class="card" id="chartCard" style="display:none;">
        <div class="chart-container"><canvas id="myChart"></canvas></div>
        <div id="result" class="result-box"></div>
    </div>
</div>

<script>
let myChart = null;

window.onload = function() {
    const saved = localStorage.getItem('invSimData_V5');
    if (saved) {
        const data = JSON.parse(saved);
        Object.keys(data).forEach(key => {
            const el = document.getElementById(key);
            if (el) el.value = data[key];
        });
        simulate();
    }
};

function simulate() {
    const inputs = {
        currentAge: parseInt(document.getElementById('currentAge').value) || 0,
        endAge: parseInt(document.getElementById('endAge').value) || 0,
        startNisaValue: parseFloat(document.getElementById('startNisaValue').value) || 0,
        nisaProfit: parseFloat(document.getElementById('nisaProfit').value) || 0,
        startIdecoValue: parseFloat(document.getElementById('startIdecoValue').value) || 0,
        idecoProfit: parseFloat(document.getElementById('idecoProfit').value) || 0,
        nisaMonthly: parseFloat(document.getElementById('nisaMonthly').value) || 0,
        idecoMonthly: parseFloat(document.getElementById('idecoMonthly').value) || 0,
        rate: parseFloat(document.getElementById('rate').value) || 0
    };

    localStorage.setItem('invSimData_V5', JSON.stringify(inputs));

    const years = inputs.endAge - inputs.currentAge;
    if (years <= 0) return;
    
    const r = inputs.rate / 100 / 12;
    const NISA_LIMIT = 18000000;

    let nisaPri = inputs.startNisaValue - inputs.nisaProfit;
    let idecoPri = inputs.startIdecoValue - inputs.idecoProfit;
    let nisaVal = inputs.startNisaValue;
    let idecoVal = inputs.startIdecoValue;
    
    let labels = [], totalAsset = [], nisaPriData = [], idecoPriData = [];
    let limitYear = 0;

    labels.push(`${inputs.currentAge}歳`);
    totalAsset.push(Math.round(nisaVal + idecoVal));
    nisaPriData.push(Math.round(nisaPri));
    idecoPriData.push(Math.round(idecoPri));

    for (let y = 1; y <= years; y++) {
        for (let m = 1; m <= 12; m++) {
            if (nisaPri + inputs.nisaMonthly <= NISA_LIMIT) {
                nisaVal += inputs.nisaMonthly; nisaPri += inputs.nisaMonthly;
            } else if (limitYear === 0) {
                const rem = Math.max(0, NISA_LIMIT - nisaPri);
                nisaVal += rem; nisaPri += rem;
                limitYear = inputs.currentAge + y;
            }
            nisaVal *= (1 + r);
            idecoVal += inputs.idecoMonthly; idecoPri += inputs.idecoMonthly;
            idecoVal *= (1 + r);
        }
        labels.push(`${inputs.currentAge + y}歳`);
        totalAsset.push(Math.round(nisaVal + idecoVal));
        nisaPriData.push(Math.round(nisaPri));
        idecoPriData.push(Math.round(idecoPri));
    }

    document.getElementById('chartCard').style.display = 'block';
    const finalAsset = nisaVal + idecoVal;
    const finalPrincipal = nisaPri + idecoPri;

    document.getElementById('result').innerHTML = `
        ${limitYear > 0 ? `<div class="status">⚠️${limitYear}歳でNISA枠に到達</div>` : ""}
        <div class="summary-item"><span>最終評価額合計</span><span>¥${Math.round(finalAsset).toLocaleString()}</span></div>
        <div class="summary-item"><span>累計掛金(NISA)</span><span>¥${Math.round(nisaPri).toLocaleString()}</span></div>
        <div class="summary-item"><span>累計掛金(iDeCo)</span><span>¥${Math.round(idecoPri).toLocaleString()}</span></div>
        <div class="summary-total"><div class="summary-item"><span>合計運用益</span><span>+¥${Math.round(finalAsset - finalPrincipal).toLocaleString()}</span></div></div>
    `;

    const ctx = document.getElementById('myChart').getContext('2d');
    if (myChart) myChart.destroy();
    myChart = new Chart(ctx, {
        data: {
            labels: labels,
            datasets: [
                { type: 'line', label: '合計評価額', data: totalAsset, borderColor: '#1a73e8', backgroundColor: 'rgba(26,115,232,0.1)', fill: false, tension: 0.3, yAxisID: 'y' },
                { type: 'bar', label: 'NISA掛金', data: nisaPriData, backgroundColor: '#81c995', stack: 'Stack 0' },
                { type: 'bar', label: 'iDeCo掛金', data: idecoPriData, backgroundColor: '#fdd663', stack: 'Stack 0' }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            scales: { 
                y: { stacked: true, beginAtZero: true, ticks: { callback: v => (v / 10000) + '万' } },
                x: { stacked: true }
            },
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10 } } } }
        }
    });
    
    setTimeout(() => {
        document.getElementById('chartCard').scrollIntoView({behavior: 'smooth', block: 'nearest'});
    }, 100);
}
</script>
</body>
</html>
