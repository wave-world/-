<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NISA & iDeCo シミュレータ</title>
    
    <link rel="icon" href="icon.png?v=1">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="投資シミュ">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary-color: #1a73e8; --bg-color: #f0f2f5; }
        body { font-family: -apple-system, sans-serif; padding: 15px; background: var(--bg-color); color: #333; margin: 0; }
        .container { max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2 { text-align: center; color: var(--primary-color); margin-bottom: 15px; font-size: 18px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-group { flex: 1; margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 11px; color: #555; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; transition: border 0.3s; appearance: none; }
        input:focus { border-color: var(--primary-color); outline: none; }
        button { width: 100%; padding: 16px; background: var(--primary-color); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        button:active { transform: scale(0.98); background: #1557b0; }
        .result-box { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 10px; border-left: 5px solid var(--primary-color); }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .summary-total { border-top: 2px solid #ddd; padding-top: 10px; font-size: 18px; color: var(--primary-color); font-weight: bold; }
        .status { font-size: 11px; color: #d93025; font-weight: bold; margin-bottom: 10px; }
        .chart-container { position: relative; height: 45vh; width: 100%; margin-top: 10px;}
        hr { border: 0; border-top: 1px solid #eee; margin: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>現在の状況</h2>
        <div class="input-row">
            <div class="input-group"><label>現在の年齢</label><input type="number" id="currentAge" value="30"></div>
            <div class="input-group"><label>終了年齢</label><input type="number" id="endAge" value="65"></div>
        </div>
        <div class="input-row">
            <div class="input-group"><label>NISA現在の評価額</label><input type="number" id="startNisaValue" value="1000000"></div>
            <div class="input-group"><label>NISA使用済枠(元本)</label><input type="number" id="usedNisaLimit" value="800000"></div>
        </div>
        <div class="input-group"><label>iDeCo現在の評価額</label><input type="number" id="startIdecoValue" value="500000"></div>

        <hr>
        <h2>積立設定</h2>
        <div class="input-row">
            <div class="input-group"><label>NISA月額(最大10万)</label><input type="number" id="nisaMonthly" value="50000"></div>
            <div class="input-group"><label>iDeCo月額</label><input type="number" id="idecoMonthly" value="23000"></div>
        </div>
        <div class="input-group"><label>期待利率 (年利%)</label><input type="number" id="rate" value="5" step="0.1"></div>
        <button onclick="simulate()">計算 ＆ データを保存</button>
    </div>

    <div class="card" id="chartCard" style="display:none;">
        <div class="chart-container"><canvas id="myChart"></canvas></div>
        <div id="result" class="result-box"></div>
    </div>
</div>

<script>
let myChart = null;

// 起動時に LocalStorage から復元
window.onload = function() {
    const saved = localStorage.getItem('invSimData_Master');
    if (saved) {
        const data = JSON.parse(saved);
        Object.keys(data).forEach(key => {
            const el = document.getElementById(key);
            if (el) el.value = data[key];
        });
        simulate();
    }
};

function simulate() {
    const inputs = {
        currentAge: parseInt(document.getElementById('currentAge').value) || 0,
        endAge: parseInt(document.getElementById('endAge').value) || 0,
        startNisaValue: parseFloat(document.getElementById('startNisaValue').value) || 0,
        usedNisaLimit: parseFloat(document.getElementById('usedNisaLimit').value) || 0,
        startIdecoValue: parseFloat(document.getElementById('startIdecoValue').value) || 0,
        nisaMonthly: Math.min(parseFloat(document.getElementById('nisaMonthly').value) || 0, 100000),
        idecoMonthly: parseFloat(document.getElementById('idecoMonthly').value) || 0,
        rate: parseFloat(document.getElementById('rate').value) || 0
    };

    document.getElementById('nisaMonthly').value = inputs.nisaMonthly;
    localStorage.setItem('invSimData_Master', JSON.stringify(inputs));

    const years = inputs.endAge - inputs.currentAge;
    if (years <= 0) return;
    
    const r = inputs.rate / 100 / 12;
    const NISA_LIMIT = 18000000;

    let labels = [], assetData = [], principalData = [];
    let nisaTotal = inputs.startNisaValue, nisaPrincipal = inputs.usedNisaLimit;
    let idecoTotal = inputs.startIdecoValue, idecoPrincipal = inputs.startIdecoValue;
    let limitYear = 0;

    labels.push(`${inputs.currentAge}歳`);
    assetData.push(Math.round(nisaTotal + idecoTotal));
    principalData.push(Math.round(nisaPrincipal + idecoPrincipal));

    for (let y = 1; y <= years; y++) {
        for (let m = 1; m <= 12; m++) {
            if (nisaPrincipal + inputs.nisaMonthly <= NISA_LIMIT) {
                nisaTotal += inputs.nisaMonthly; nisaPrincipal += inputs.nisaMonthly;
            } else if (limitYear === 0) {
                const rem = NISA_LIMIT - nisaPrincipal;
                nisaTotal += rem; nisaPrincipal += rem;
                limitYear = inputs.currentAge + y;
            }
            nisaTotal *= (1 + r);
            idecoTotal += inputs.idecoMonthly; idecoPrincipal += inputs.idecoMonthly;
            idecoTotal *= (1 + r);
        }
        labels.push(`${inputs.currentAge + y}歳`);
        assetData.push(Math.round(nisaTotal + idecoTotal));
        principalData.push(Math.round(nisaPrincipal + idecoPrincipal));
    }

    document.getElementById('chartCard').style.display = 'block';
    const finalAsset = nisaTotal + idecoTotal;
    const finalPrincipal = nisaPrincipal + idecoPrincipal;

    document.getElementById('result').innerHTML = `
        ${limitYear > 0 ? `<div class="status">⚠️${limitYear}歳でNISA生涯枠(1,800万)に到達</div>` : ""}
        <div class="summary-item"><span>評価金額合計</span><span>¥${Math.round(finalAsset).toLocaleString()}</span></div>
        <div class="summary-item"><span>掛金合計(元本)</span><span>¥${Math.round(finalPrincipal).toLocaleString()}</span></div>
        <div class="summary-total"><div class="summary-item"><span>運用益</span><span>+¥${Math.round(finalAsset - finalPrincipal).toLocaleString()}</span></div></div>
    `;

    const ctx = document.getElementById('myChart').getContext('2d');
    if (myChart) myChart.destroy();
    myChart = new Chart(ctx, {
        data: {
            labels: labels,
            datasets: [
                { type: 'line', label: '評価金額', data: assetData, borderColor: '#1a73e8', backgroundColor: 'rgba(26,115,232,0.1)', fill: false, tension: 0.3, zIndex: 2 },
                { type: 'bar', label: '掛金(元本)', data: principalData, backgroundColor: 'rgba(95, 99, 104, 0.4)', borderRadius: 5, zIndex: 1 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            scales: { y: { beginAtZero: true, ticks: { callback: v => (v / 10000) + '万' } } }
        }
    });
    
    setTimeout(() => {
        document.getElementById('chartCard').scrollIntoView({behavior: 'smooth', block: 'nearest'});
    }, 100);
}
</script>
</body>
</html>
